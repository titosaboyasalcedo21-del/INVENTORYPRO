services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-inventorypro}
      MYSQL_USER: ${DB_USERNAME:-inventorypro_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.docker}
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment: &app-environment
      APP_NAME: ${APP_NAME:-InventoryPro}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Generate and set APP_KEY in .env.docker}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-inventorypro}
      DB_USERNAME: ${DB_USERNAME:-inventorypro_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
      MAIL_MAILER: ${MAIL_MAILER:-log}
      INVENTORY_CURRENCY: ${INVENTORY_CURRENCY:-PEN}
      INVENTORY_CURRENCY_SYMBOL: ${INVENTORY_CURRENCY_SYMBOL:-S/}
      INVENTORY_TAX_RATE: ${INVENTORY_TAX_RATE:-0.00}
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',9000); exit($$s ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  queue:
    build:
      context: .
      target: app
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    environment: *app-environment
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - app-storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  database-data:
  app-storage:
